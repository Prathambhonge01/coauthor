<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0e11" media="(prefers-color-scheme: dark)" />
    <title>Coauthor</title>
    <script>
      (() => {
        try {
          const pref = localStorage.getItem('coauthor.theme') || 'auto';
          const mq = window.matchMedia('(prefers-color-scheme: dark)');
          const resolved = pref === 'auto' ? (mq.matches ? 'dark' : 'light') : pref;
          const root = document.documentElement;
          root.dataset.theme = resolved;
          root.dataset.themePref = pref;
          root.style.colorScheme = resolved;
        } catch {}
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✍️</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
