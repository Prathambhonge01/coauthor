# One command: docker compose up --build   ->  http://localhost:8080
# Scale the collaboration tier:  docker compose up --build --scale server=2
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coauthor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coauthor}
      POSTGRES_DB: coauthor
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [coauthor]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coauthor"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [coauthor]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://coauthor:${POSTGRES_PASSWORD:-coauthor}@db:5432/coauthor
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (e.g. openssl rand -hex 32)}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      PERSIST_DEBOUNCE_MS: ${PERSIST_DEBOUNCE_MS:-1500}
      AUTO_VERSION_MS: ${AUTO_VERSION_MS:-600000}
    networks: [coauthor]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 5

  web:
    build: ./client
    restart: unless-stopped
    ports: ["8080:80"]
    networks: [coauthor]
    depends_on:
      server: { condition: service_healthy }

networks:
  coauthor:
    driver: bridge

volumes:
  pgdata:
